#
# NepFleet as a container. See docs/install.md.
#
# Settings come from .env next to this file (see docs/install.md):
#   NEPFLEET_UID, NEPFLEET_GID  owner of /srv/nepfleet, usually your user
#   DOCKER_GID                  the host's docker group id
#   NEPFLEET_HOST               this host's name in the fleet repository
#
#   docker compose up -d                 the API (nepfleet serve)
#   docker compose run --rm nepfleet …   the CLI, same mounts and settings

name: nepfleet

services:
  nepfleet:
    image: ghcr.io/serraniel/nepfleet:latest   # or :edge
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # Runs as the owner of /srv/nepfleet, so you can edit and commit the fleet
    # repository on the host. Membership in the host's docker group is what
    # grants socket access; the process itself stays unprivileged.
    user: "${NEPFLEET_UID:?set NEPFLEET_UID in .env}:${NEPFLEET_GID:?set NEPFLEET_GID in .env}"
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env to the host docker group id}"]
    # The container's own hostname is random; stacks target the host by name.
    hostname: "${NEPFLEET_HOST:?set NEPFLEET_HOST in .env to this host's name}"
    environment:
      NEPFLEET_HOST: "${NEPFLEET_HOST}"
      # Stack working directories. Must persist, and must have the same path
      # on the host, because the Docker daemon resolves bind mounts there.
      NEPFLEET_STATE: /srv/nepfleet/state
      HOME: /tmp
      # Template-source cache and registry logins, kept across runs.
      XDG_CACHE_HOME: /srv/nepfleet/cache
      DOCKER_CONFIG: /srv/nepfleet/docker
      # Registered emulators (system/binfmt), so apply can tell which images
      # for other CPUs will run. The container's own /proc does not have it.
      NEPFLEET_BINFMT_DIR: /host/binfmt_misc
      SOPS_AGE_KEY_FILE: /srv/nepfleet/age.key
      # Identity for the commits that rollback makes.
      GIT_AUTHOR_NAME: "${NEPFLEET_GIT_NAME:-NepFleet}"
      GIT_AUTHOR_EMAIL: "${NEPFLEET_GIT_EMAIL:-nepfleet@localhost}"
      GIT_COMMITTER_NAME: "${NEPFLEET_GIT_NAME:-NepFleet}"
      GIT_COMMITTER_EMAIL: "${NEPFLEET_GIT_EMAIL:-nepfleet@localhost}"
    # Plain HTTP inside the container: the port below is published on the
    # host's loopback only. Put TLS in front before you publish it wider.
    command: ["serve", "--listen", ":7480", "--behind-proxy"]
    volumes:
      # Root-equivalent access to this host. Read docs/security.md first.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out: the Docker daemon resolves the stacks'
      # relative bind mounts on the host, so the paths must match. Holds the
      # fleet repository, state, caches and age.key.
      - /srv/nepfleet:/srv/nepfleet
      - /proc/sys/fs/binfmt_misc:/host/binfmt_misc:ro
    working_dir: /srv/nepfleet/fleet
    # neptide (the neptide system stack) updates this container: a container
    # cannot replace itself, so neptide does it from outside, waits for this
    # health check and rolls back when the new version does not pass.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7480/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s   # check quickly after a (re)start, so updates finish fast
      retries: 3
    labels:
      neptide.enable: "true"
      # Only bind mounts, and /srv/nepfleet also holds every stack's data:
      # never roll that back together with NepFleet.
      neptide.snapshot: "false"
    # Loopback only. Expose the API through the Caddy system stack (TLS) instead.
    ports:
      - "127.0.0.1:7480:7480"
