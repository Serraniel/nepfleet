# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The HTTP API of `nepfleet serve`, served at /api/v1/openapi.yaml.
# openapi_test.go keeps this and the code's routes and field names the same.
openapi: 3.1.0
info:
  title: NepFleet API
  version: v1
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: >-
    Manage a fleet's stacks. Programs use an API token, people a session from
    signing in. A token limited to stacks gets 404 for all others. See docs/api.md.
servers:
  - url: http://127.0.0.1:7480
    description: The default address of `nepfleet serve`
security:
  - token: []
  - session: []
tags:
  - name: stacks
  - name: signing-in
  - name: server
paths:
  /healthz:
    get:
      tags: [server]
      operationId: health
      summary: Whether the server is up
      security: []
      responses:
        "204": { description: Up }
  /api/v1/openapi.yaml:
    get:
      tags: [server]
      operationId: openapi
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/info:
    get:
      tags: [server]
      operationId: info
      summary: Name, version and API version
      security: []
      responses:
        "200":
          description: About this server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
  /api/v1/stacks:
    get:
      tags: [stacks]
      operationId: listStacks
      summary: The stacks the token covers
      description: Needs the read scope.
      responses:
        "200":
          description: Stacks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StackInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
    post:
      tags: [stacks]
      operationId: createStack
      summary: Create a stack from a template, in one commit
      description: >-
        As nepfleet new: checks the name, the values against the template's inputs, and that
        the stack renders; secret inputs are stored encrypted. Commits as the person or token,
        without applying: plan and apply afterwards. Needs the edit scope; a token limited to
        stacks creates only those, and a person needs a sign-in or passkey verification within
        5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewStack" }
      responses:
        "201":
          description: Created and committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewStackResult" }
        "400": { description: Not a request this endpoint takes }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't edit, the token doesn't cover that name, or `{\"verify\": true}`" }
        "409": { description: A stack of that name exists, or another operation runs }
        "422": { description: The template or the values don't fit; nothing was written }
  /api/v1/templates:
    get:
      tags: [stacks]
      operationId: listTemplates
      summary: The catalogue of each template source of the fleet
      description: >-
        Needs the read scope. Each source has its commit and its catalogue, in the
        index.json format. Templates that don't validate are listed as invalid.
      responses:
        "200":
          description: Template sources
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/stacks/{name}/plan:
    get:
      tags: [stacks]
      operationId: planStack
      summary: What an apply would change
      description: Needs the read scope. Secrets are masked. The id goes into an apply.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
        - name: updateLock
          in: query
          description: "true: plan as apply --update-lock would, with newer image digests and the template source's current commit. Asks the registries."
          schema: { type: boolean }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/stacks/{name}/apply:
    post:
      tags: [stacks]
      operationId: applyStack
      summary: Start applying a reviewed plan
      description: Needs the apply scope. Refused if the plan has changed since it was read.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, description: The plan's id }
                confirmDestructive: { type: boolean }
                updateLock: { type: boolean, description: "Apply a plan made with ?updateLock=true" }
      responses:
        "202":
          description: The job that applies it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { description: No plan ID was sent }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The plan is out of date or destructive, or the stack is busy" }
  /api/v1/stacks/{name}/rollback:
    post:
      tags: [stacks]
      operationId: rollbackStack
      summary: Start rolling back to a commit from the stack's history
      description: Needs the apply scope.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit]
              properties:
                commit: { type: string, description: The full commit ID }
                confirmDestructive: { type: boolean }
      responses:
        "202":
          description: The job that rolls it back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { description: No commit ID was sent }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The rollback is destructive, or the stack is busy" }
  /api/v1/stacks/{name}/updates:
    get:
      tags: [stacks]
      operationId: stackUpdates
      summary: What the registries have for the stack's images
      description: >-
        Newer tags within and beyond each image's track, and tags rebuilt since
        lock.yaml pinned them, as `nepfleet updates --json`. Asks the
        registries, so it takes a while. Read-only.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      responses:
        "200":
          description: One entry per image
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImageUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Another operation runs; try again }
  /api/v1/stacks/{name}/egress:
    get:
      tags: [stacks]
      operationId: stackEgress
      summary: What the stack's egress sidecars recorded or refused
      description: >-
        As `nepfleet egress suggest`: in mode log, where the stack went; in mode
        enforce, what was refused. Both less what's already allowed. Reads the
        sidecars on the server's host.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StackEgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Another operation runs; try again }
  /api/v1/stacks/{name}/files:
    get:
      tags: [stacks]
      operationId: stackFiles
      summary: The stack's editable files (edit scope)
      description: >-
        stack.yaml, a plain stack's compose.yaml, and files/**, with each one's git
        blob hash as its revision. Encrypted values and lock.yaml are never listed.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StackFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [stacks]
      operationId: editStack
      summary: Change stack files, in one commit
      description: >-
        Needs the edit scope; a person also needs a sign-in or passkey
        verification within 5 minutes. Writes only the given files, checks that the
        stack still loads and renders, and commits as the person or token. It
        doesn't apply: plan and apply afterwards.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StackEdit" }
      responses:
        "200":
          description: The commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditResult" }
        "400": { description: "A path that isn't one of the stack's editable files, or no files" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't edit, or `{\"verify\": true}`: a person must verify first" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A file changed since it was read, or another operation runs" }
        "422": { description: The stack would no longer load or render; nothing was saved }
  /api/v1/stacks/{name}/secrets:
    get:
      tags: [stacks]
      operationId: stackSecretKeys
      summary: The keys of the stack's encrypted values, never the values (edit scope)
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretKeys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The scope isn't edit }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/stacks/{name}/secrets/{key}:
    put:
      tags: [stacks]
      operationId: setStackSecret
      summary: Store one of the stack's secrets, encrypted, in one commit
      description: >-
        Write-only, like nepfleet secret set: the value is encrypted with SOPS into
        values.secret.yaml and never returned or logged. Needs the edit scope; a
        person also needs a sign-in or passkey verification within 5 minutes. It
        doesn't apply: plan and apply afterwards.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
        - { $ref: "#/components/parameters/SecretKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: The commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretResult" }
        "400": { description: "Not a variable name, or no value (at most 64 KiB)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't edit, or `{\"verify\": true}`: a person must verify first" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Another operation runs, or the file has uncommitted changes on the server" }
    delete:
      tags: [stacks]
      operationId: removeStackSecret
      summary: Remove one of the stack's secrets, in one commit
      description: Needs the edit scope, and a recent verification for a person.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
        - { $ref: "#/components/parameters/SecretKey" }
      responses:
        "200":
          description: The commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't edit, or `{\"verify\": true}`" }
        "404": { description: No such stack, or no secret of that key }
        "409": { description: "Another operation runs, or the file has uncommitted changes on the server" }
  /api/v1/features:
    get:
      tags: [server]
      operationId: features
      summary: The opt-in system stacks, as nepfleet enable lists them
      description: >-
        Needs the read scope. Each feature names the official template that provides
        it and the stacks already doing so (those the token sees). Enabling one is
        creating a stack from its template (POST /api/v1/stacks).
      responses:
        "200":
          description: The features
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Feature" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/notifications/channels:
    get:
      tags: [server]
      operationId: channels
      summary: The notification channels of fleet.yaml, by name only
      description: Needs the read scope. Their URLs hold tokens and are never served.
      responses:
        "200":
          description: The names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channels" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/notifications/channels/{name}/test:
    post:
      tags: [server]
      operationId: testChannel
      summary: Send a channel a test message, as nepfleet notify test (admin scope)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Sent }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The scope isn't admin }
        "404": { description: No channel of that name }
        "502": { description: "Sending failed; the reason, with URLs removed" }
  /api/v1/tokens:
    get:
      tags: [server]
      operationId: tokens
      summary: The API tokens, never their secrets (admin scope)
      responses:
        "200":
          description: The tokens, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The scope isn't admin }
    post:
      tags: [server]
      operationId: createToken
      summary: Create an API token; its secret is shown only in this answer
      description: >-
        As nepfleet token create. Needs the admin scope; a person also needs a
        sign-in or passkey verification within 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewToken" }
      responses:
        "201":
          description: The token, with its secret this once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        "400": { description: Not the expected body }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't admin, or `{\"verify\": true}`" }
        "422": { description: "A rule broken: scope, name, stacks, or days (1 to 3650)" }
  /api/v1/tokens/{id}:
    delete:
      tags: [server]
      operationId: revokeToken
      summary: Revoke an API token (admin scope)
      description: A person also needs a recent verification.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{8}$" } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't admin, or `{\"verify\": true}`" }
        "404": { description: No such token }
  /api/v1/stacks/{name}/sbom:
    get:
      tags: [stacks]
      operationId: stackSBOM
      summary: The stack's software bill of materials (CycloneDX), as nepfleet sbom
      description: Needs the read scope. With contents=true it also lists what's inside the images (slower).
      parameters:
        - { $ref: "#/components/parameters/StackName" }
        - { name: contents, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The CycloneDX document
          content:
            application/vnd.cyclonedx+json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Another operation runs; try again }
  /api/v1/sbom:
    get:
      tags: [server]
      operationId: fleetSBOM
      summary: The fleet's software bill of materials (CycloneDX), over the stacks the token sees
      parameters:
        - { name: contents, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The CycloneDX document
          content:
            application/vnd.cyclonedx+json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/doctor:
    get:
      tags: [server]
      operationId: doctor
      summary: How the server's host stands, as nepfleet doctor and doctor --security (admin scope)
      responses:
        "200":
          description: The checks and the security findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The scope isn't admin }
        "503": { description: Another operation runs; try again }
  /api/v1/users:
    get:
      tags: [server]
      operationId: users
      summary: The people who sign in, and their passkeys (admin scope)
      responses:
        "200":
          description: The users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The scope isn't admin }
        "503": { description: This server has no accounts }
  /api/v1/users/{user}:
    delete:
      tags: [server]
      operationId: removeUser
      summary: Remove a person; their sessions end (admin scope)
      description: A person can't remove themselves here, and needs a recent verification.
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't admin, or `{\"verify\": true}`" }
        "404": { description: No such user }
        "409": { description: That's you }
  /api/v1/users/{user}/passkeys/{id}:
    delete:
      tags: [server]
      operationId: removePasskey
      summary: Remove one of a person's passkeys (admin scope)
      description: >-
        The passkey is named by its ID, or a start of it that fits only one. The
        last way a person signs in can't be removed; remove the person instead.
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "400": { description: Not a passkey ID }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't admin, or `{\"verify\": true}`" }
        "409": { description: "No such user or passkey, more than one fits, or it's the last way in" }
  /api/v1/stacks/{name}/egress/allow:
    post:
      tags: [stacks]
      operationId: allowEgress
      summary: Add hosts or addresses to the stack's egress allow list, in one commit
      description: >-
        As pasting nepfleet egress suggest's list: adds the entries to
        spec.egress.allow in stack.yaml (keeping its comments), checks the stack
        still loads, and commits as the person or token. It doesn't apply. Needs the
        edit scope, and a recent verification for a person.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressAllow" }
      responses:
        "200":
          description: The commit (none when all were allowed already) and what was added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressAllowResult" }
        "400": { description: Not the expected body }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't edit, or `{\"verify\": true}`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Another operation runs, or stack.yaml has uncommitted changes on the server" }
        "422": { description: "Not a host name, address or range (no wildcards); nothing saved" }
  /api/v1/stacks/{name}/render:
    get:
      tags: [stacks]
      operationId: renderStack
      summary: The files the stack renders to, secrets masked, as nepfleet render
      description: Needs the read scope.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
      responses:
        "200":
          description: The files, by path
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RenderedFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: The stack doesn't render; the reason }
        "503": { description: Another operation runs; try again }
  /api/v1/updates/run:
    post:
      tags: [stacks]
      operationId: runUpdates
      summary: Run nepfleet updates apply now, as a job
      description: >-
        Stacks with updates auto take rebuilt images (health-gated, never with
        destructive changes), within spec.updates.window unless now is true; the
        others' news goes to the notification channels once. Needs the apply scope,
        and a token not limited to stacks. Follow the job at /api/v1/jobs/{id}.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: boolean, description: Ignore spec.updates.window }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { description: Not the expected body }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't apply, or the token is limited to stacks" }
        "409": { description: Another operation runs }
  /api/v1/key/backup:
    post:
      tags: [server]
      operationId: keyBackup
      summary: Download the fleet's age key, encrypted to your public keys
      description: >-
        As nepfleet key backup --recipient: the server's age key, which opens every
        secret, encrypted with age to the given age or SSH public keys (no
        passphrase travels), and recorded so doctor stops reminding. Only a person
        signed in, who confirmed with a passkey within 5 minutes; API tokens are
        refused. The fleet's notification channels hear of every backup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyBackupRequest" }
      responses:
        "200":
          description: The age-armored backup
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: Not the expected body }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "An API token, not a person; or `{\"verify\": true}`" }
        "409": { description: "The key isn't a file on the server (SOPS_AGE_KEY or SOPS_AGE_KEY_CMD)" }
        "422": { description: Not an age or SSH public key }
  /api/v1/secrets:
    get:
      tags: [server]
      operationId: fleetSecretKeys
      summary: The keys of the fleet-wide encrypted values (admin scope)
      description: fleet.secret.yaml, which every stack may reference.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretKeys" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The scope isn't admin }
  /api/v1/secrets/{key}:
    put:
      tags: [server]
      operationId: setFleetSecret
      summary: Store a fleet-wide secret, encrypted, in one commit (admin scope)
      parameters:
        - { $ref: "#/components/parameters/SecretKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: The commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretResult" }
        "400": { description: "Not a variable name, or no value (at most 64 KiB)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't admin, or `{\"verify\": true}`" }
        "409": { description: "Another operation runs, or the file has uncommitted changes on the server" }
    delete:
      tags: [server]
      operationId: removeFleetSecret
      summary: Remove a fleet-wide secret, in one commit (admin scope)
      parameters:
        - { $ref: "#/components/parameters/SecretKey" }
      responses:
        "200":
          description: The commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The scope isn't admin, or `{\"verify\": true}`" }
        "404": { description: No secret of that key }
        "409": { description: "Another operation runs, or the file has uncommitted changes on the server" }
  /api/v1/sync:
    get:
      tags: [server]
      operationId: syncStatus
      summary: Where the fleet repository stands against its origin
      description: Needs the read scope.
      responses:
        "200":
          description: The last sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [server]
      operationId: syncNow
      summary: Pull the fleet repository and apply changed stacks set to apply auto
      description: >-
        Starts a sync in the background. Takes a token with the apply scope, or a forge's
        webhook signed with NEPFLEET_SYNC_SECRET (X-Hub-Signature-256, X-Forgejo-Signature or
        X-Gitea-Signature, HMAC-SHA256 of the body). Only fast-forwards.
      responses:
        "202": { description: Started }
        "401": { description: No token, and no valid signature }
        "403": { description: The token's scope isn't apply }
        "503": { description: Sync is off on this server }
  /api/v1/maintenance:
    get:
      tags: [server]
      operationId: maintenance
      summary: The maintenance windows of the fleet's Uptime Kuma instances
      description: >-
        One entry per instance in fleet.yaml, with its windows, or the error
        reading them. Fleet-wide: a token limited to stacks gets 403.
      responses:
        "200":
          description: One entry per Kuma
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KumaMaintenance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The token is limited to stacks }
  /api/v1/alerts:
    post:
      tags: [server]
      operationId: sendAlert
      summary: Send another tool's alert to the fleet's notification channels
      description: >-
        For tools such as Dozzle. Needs a notify or admin token. Alerts are
        deduplicated like NepFleet's own events: the same rule on the same
        container once per dedup window. The container's compose project names
        the stack. Text is cut to fit messages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Alert" }
      responses:
        "202": { description: Recorded, and sent unless deduplicated }
        "400": { description: Not an alert, or neither a rule nor a detail }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The token's scope isn't notify or admin }
  /api/v1/stacks/{name}/history:
    get:
      tags: [stacks]
      operationId: stackHistory
      summary: The commits that touched a stack, newest first
      description: Needs the read scope.
      parameters:
        - { $ref: "#/components/parameters/StackName" }
        - name: n
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/jobs/{id}:
    get:
      tags: [stacks]
      operationId: getJob
      summary: A job's state, error and log
      description: Needs the read scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events:
    get:
      tags: [server]
      operationId: listEvents
      summary: Notification events newer than an ID, oldest first
      description: >-
        Needs the read scope. A token limited to stacks sees only those, and no
        host-wide events.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /metrics:
    get:
      tags: [server]
      operationId: metrics
      summary: Prometheus metrics
      description: Needs the read scope, filtered like the rest, since stack names aren't for anyone who reaches the port.
      responses:
        "200":
          description: Prometheus' text format
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/stream:
    get:
      tags: [server]
      operationId: streamEvents
      summary: The same events, live, as server-sent events
      description: >-
        Needs the read scope, with the same filtering. Sends what's newer than
        after or Last-Event-ID, then new events as they come. It ends after 10
        minutes; reconnect with the last ID, which also checks the token again.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: integer }
      responses:
        "200":
          description: The stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "No event store, or too many streams; see Retry-After" }
  /api/v1/auth/status:
    get:
      tags: [signing-in]
      operationId: authStatus
      summary: Whether setup is needed, and who is signed in
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [setupNeeded, signedIn, name, totp, oidc, passkeys, external]
                properties:
                  external:
                    type: boolean
                    description: Whether the signed-in user came through the identity provider, so can't add a passkey or codes.
                  oidc:
                    type: boolean
                    description: Whether an identity provider can sign people in.
                  passkeys:
                    type: boolean
                    description: Whether passkeys are on.
                  setupNeeded: { type: boolean }
                  signedIn: { type: boolean }
                  name: { type: string }
                  totp:
                    type: boolean
                    description: Whether the signed-in user has sign-in codes on.
  /api/v1/auth/oidc/login:
    get:
      tags: [signing-in]
      operationId: oidcLogin
      summary: Start signing in through the identity provider
      description: Only with --oidc-issuer. Open it in the browser, not with fetch.
      security: []
      parameters:
        - name: return
          in: query
          description: Where to go afterwards, in an allowed origin.
          schema: { type: string }
      responses:
        "302": { description: On to the provider }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /api/v1/auth/oidc/callback:
    get:
      tags: [signing-in]
      operationId: oidcCallback
      summary: Where the provider sends the browser back
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "303": { description: Signed in; on to the return URL }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /api/v1/auth/setup/begin:
    post:
      tags: [signing-in]
      operationId: setupBegin
      summary: Start registering the first user, with the setup token from the log
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken, name]
              properties:
                setupToken: { type: string }
                name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ceremony" }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /api/v1/auth/setup/finish:
    post:
      tags: [signing-in]
      operationId: setupFinish
      summary: Register the first user's passkey, and sign in
      security: []
      parameters:
        - { $ref: "#/components/parameters/Ceremony" }
      requestBody: { $ref: "#/components/requestBodies/Credential" }
      responses:
        "204": { description: Signed in }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/login/begin:
    post:
      tags: [signing-in]
      operationId: loginBegin
      summary: Start signing in with a passkey
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ceremony" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/login/finish:
    post:
      tags: [signing-in]
      operationId: loginFinish
      summary: Sign in with the passkey's answer
      security: []
      parameters:
        - { $ref: "#/components/parameters/Ceremony" }
      requestBody: { $ref: "#/components/requestBodies/Credential" }
      responses:
        "204": { description: Signed in }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/logout:
    post:
      tags: [signing-in]
      operationId: logout
      summary: Sign out
      security: []
      responses:
        "204": { description: Signed out }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/passkeys/begin:
    post:
      tags: [signing-in]
      operationId: passkeyBegin
      summary: Start adding a passkey
      description: >-
        Needs a recent proof that it's still the person: a sign-in or a
        verification within 5 minutes. Otherwise it answers 403 with
        `{"verify": true}`; verify with auth/verify, then ask again.
      security:
        - session: []
      responses:
        "200": { $ref: "#/components/responses/Ceremony" }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { description: "The origin isn't allowed, or `{\"verify\": true}`: verify first" }
  /api/v1/auth/verify/begin:
    post:
      tags: [signing-in]
      operationId: verifyBegin
      summary: Start proving it's still you, with one of your passkeys
      security:
        - session: []
      responses:
        "200": { $ref: "#/components/responses/Ceremony" }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/verify/finish:
    post:
      tags: [signing-in]
      operationId: verifyFinish
      summary: Finish proving it's you; counts for 5 minutes
      security:
        - session: []
      parameters:
        - { $ref: "#/components/parameters/Ceremony" }
      requestBody: { $ref: "#/components/requestBodies/Credential" }
      responses:
        "204": { description: Verified }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/passkeys/finish:
    post:
      tags: [signing-in]
      operationId: passkeyFinish
      summary: Add the passkey
      security:
        - session: []
      parameters:
        - { $ref: "#/components/parameters/Ceremony" }
      requestBody: { $ref: "#/components/requestBodies/Credential" }
      responses:
        "204": { description: Added }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/totp/begin:
    post:
      tags: [signing-in]
      operationId: totpBegin
      summary: Start turning on sign-in codes
      security:
        - session: []
      responses:
        "200":
          description: A new secret for an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [ceremony, secret, url]
                properties:
                  ceremony: { type: string }
                  secret: { type: string }
                  url: { type: string, description: An otpauth URL }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/totp/finish:
    post:
      tags: [signing-in]
      operationId: totpFinish
      summary: Turn on sign-in codes, with one from the new authenticator
      security:
        - session: []
      parameters:
        - { $ref: "#/components/parameters/Ceremony" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: Turned on }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/totp/remove:
    post:
      tags: [signing-in]
      operationId: totpRemove
      summary: Turn off sign-in codes
      security:
        - session: []
      responses:
        "204": { description: Turned off }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
  /api/v1/auth/totp/login:
    post:
      tags: [signing-in]
      operationId: totpLogin
      summary: Sign in with a code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
      responses:
        "204": { description: Signed in }
        "401": { $ref: "#/components/responses/SignInFailed" }
        "403": { $ref: "#/components/responses/OriginNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: An API token, nft_…
    session:
      type: apiKey
      in: cookie
      name: nepfleet_session
      description: From signing in. Changes also need an allowed Origin.
  parameters:
    StackName:
      name: name
      in: path
      required: true
      schema: { type: string }
    SecretKey:
      name: key
      in: path
      required: true
      description: A variable name
      schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$" }
    Ceremony:
      name: ceremony
      in: query
      required: true
      schema: { type: string }
  requestBodies:
    Credential:
      required: true
      description: The browser's PublicKeyCredential, as JSON.
      content:
        application/json:
          schema: { type: object }
  responses:
    Unauthorized: { description: No valid token or session }
    NotFound: { description: "Unknown, or not covered by this token" }
    SignInFailed: { description: Sign-in failed; all failures read alike }
    OriginNotAllowed: { description: The Origin isn't an allowed one }
    TooManyAttempts: { description: Locked out for now; see Retry-After }
    Ceremony:
      description: The options for the browser's passkey API
      content:
        application/json:
          schema:
            type: object
            required: [ceremony, options]
            properties:
              ceremony: { type: string }
              options: { type: object }
  schemas:
    Info:
      type: object
      required: [name, version, apiVersion]
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: string }
    StackInfo:
      type: object
      required: [name, target, mode, apply, updates]
      properties:
        name: { type: string }
        target: { type: string }
        mode: { type: string }
        apply: { type: string }
        template: { type: string, description: source/name@version }
        updates: { type: string }
        url: { type: string, description: "Where its web UI is, if its settings say" }
        links:
          type: array
          description: Other places to look at it, such as its logs.
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string }
              url: { type: string }
        state:
          type: string
          enum: [running, unhealthy, partial, stopped]
          description: "From this host's containers; one-shot containers that finished fine count as running. Absent for stacks on other hosts, swarm stacks, and ones not applied."
        uses:
          type: array
          description: "Values it takes from other stacks: names only, never values. Stacks this token doesn't cover are left out."
          items:
            type: object
            required: [key, from]
            properties:
              key: { type: string }
              from: { type: string }
              value: { type: string }
              secret: { type: string }
    HistoryEntry:
      type: object
      required: [commit, date, author, subject]
      properties:
        commit: { type: string }
        date: { type: string, format: date-time }
        author: { type: string }
        subject: { type: string }
        applied: { type: boolean, description: The revision running now }
    Job:
      type: object
      required: [id, stack, kind, state, started, log, by]
      properties:
        id: { type: string }
        stack: { type: string, description: "Empty for a fleet-wide job (updates)" }
        kind: { type: string, enum: [apply, rollback, updates] }
        state: { type: string, enum: [running, succeeded, failed] }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        error: { type: string }
        log: { type: string }
        by: { type: string }
    StackEgress:
      type: object
      required: [mode, sidecars, hosts, addresses, lookedUp]
      properties:
        mode: { type: string, enum: ["off", "log", "enforce"] }
        sidecars: { type: integer, description: "The stack's egress sidecars on this host; 0 means nothing is recorded" }
        hosts: { type: array, items: { type: string }, description: Names looked up and then connected to (or refused) }
        addresses: { type: array, items: { type: string }, description: Addresses with no name seen }
        lookedUp: { type: array, items: { type: string }, description: Names looked up but never connected to }
    Feature:
      type: object
      required: [name, template, what, stacks]
      properties:
        name: { type: string }
        template: { type: string }
        what: { type: string }
        stacks: { type: array, items: { type: string }, description: "name@target" }
    KeyBackupRequest:
      type: object
      required: [recipients]
      properties:
        recipients: { type: array, items: { type: string }, maxItems: 10, description: "age1… or ssh-ed25519/ssh-rsa public keys" }
    RenderedFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    EgressAllow:
      type: object
      required: [add]
      properties:
        add: { type: array, items: { type: string }, maxItems: 200 }
    EgressAllowResult:
      type: object
      required: [added]
      properties:
        commit: { type: string }
        added: { type: array, items: { type: string } }
    UserInfo:
      type: object
      required: [name, created, codes, passkeys]
      properties:
        name: { type: string }
        created: { type: string, format: date-time }
        external: { type: boolean }
        codes: { type: boolean, description: Sign-in codes are on }
        passkeys: { type: array, items: { $ref: "#/components/schemas/PasskeyInfo" } }
    PasskeyInfo:
      type: object
      required: [id, name, synced, uses]
      properties:
        id: { type: string, description: The whole credential ID, base64url }
        name: { type: string, description: Its start, as nepfleet user passkeys shows it }
        synced: { type: boolean }
        uses: { type: integer }
        locked: { type: boolean, description: May have been copied; refused until removed }
    DoctorCheck:
      type: object
      required: [name, status, detail]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, warn, fail] }
        detail: { type: string }
        fix: { type: string }
    SecurityFinding:
      type: object
      required: [check, level, message]
      properties:
        check: { type: string }
        level: { type: string }
        message: { type: string }
    DoctorReport:
      type: object
      required: [host, stacks, checks, security]
      properties:
        host: { type: string }
        stacks: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/DoctorCheck" } }
        security: { type: array, items: { $ref: "#/components/schemas/SecurityFinding" } }
        securityError: { type: string }
    Channels:
      type: object
      required: [channels]
      properties:
        channels: { type: array, items: { type: string } }
    TokenInfo:
      type: object
      required: [id, name, scope, created, expires, expired]
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string, enum: [read, apply, edit, admin, notify] }
        stacks: { type: array, items: { type: string }, description: "Empty: all stacks" }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time }
        expired: { type: boolean }
    NewToken:
      type: object
      required: [name, scope, days]
      properties:
        name: { type: string, maxLength: 64 }
        scope: { type: string, enum: [read, apply, edit, admin, notify] }
        stacks: { type: array, items: { type: string } }
        days: { type: integer, minimum: 1, maximum: 3650 }
    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/TokenInfo" }
        secret: { type: string, description: Shown only in this answer }
    SecretKeys:
      type: object
      required: [keys]
      properties:
        keys: { type: array, items: { type: string } }
    SecretValue:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 65536 }
    SecretResult:
      type: object
      required: [commit]
      properties:
        commit: { type: string }
    SyncStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        interval: { type: string }
        last: { type: string, format: date-time }
        commit: { type: string }
        error: { type: string }
        applied: { type: array, items: { type: string } }
        failed: { type: array, items: { type: string } }
        pending: { type: array, items: { type: string } }
    NewStack:
      type: object
      required: [template]
      properties:
        template: { type: string }
        source: { type: string, description: "A template source of fleet.yaml; default official" }
        name: { type: string, description: "Default: the template's name" }
        target: { type: string, description: "The host; default local" }
        access: { type: string, enum: [domain, port], description: "Behind Caddy (default), or a LAN port" }
        port: { type: integer, description: "For access port; 0 picks a free one" }
        values: { type: object, additionalProperties: { type: string }, description: "The template's inputs; secret ones are stored encrypted" }
    NewStackResult:
      type: object
      required: [name, commit]
      properties:
        name: { type: string }
        commit: { type: string }
        port: { type: integer }
    StackFile:
      type: object
      required: [path, content, revision]
      properties:
        path: { type: string, description: In the stack's directory }
        content: { type: string }
        revision: { type: string, description: "The file's git blob hash, sent back as its base" }
    StackEdit:
      type: object
      properties:
        files: { type: object, additionalProperties: { type: string }, description: Path to new content }
        base: { type: object, additionalProperties: { type: string }, description: "Path to the revision read; empty for a new file" }
        message: { type: string, description: "The commit's subject" }
    EditResult:
      type: object
      required: [commit]
      properties:
        commit: { type: string }
    KumaMaintenance:
      type: object
      required: [kuma, windows]
      properties:
        kuma: { type: string, description: Its name in fleet.yaml }
        error: { type: string }
        windows:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceWindow" }
    MaintenanceWindow:
      type: object
      required: [id, title, strategy, active, status]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        strategy: { type: string, description: "manual, single, recurring-… or cron" }
        active: { type: boolean }
        status: { type: string, description: "under-maintenance, scheduled, ended, inactive or unknown" }
        start: { type: string, description: Its next or current slot's start, as Kuma reports it }
        end: { type: string }
    ImageUpdate:
      type: object
      required: [stack, image, track, current]
      properties:
        stack: { type: string }
        image: { type: string }
        track: { type: string, description: "major, minor, patch or digest" }
        current: { type: string, description: The tag in use }
        next: { type: string, description: The newest tag the track allows; it comes with a template update }
        beyond: { type: string, description: A newer tag outside the track }
        rebuilt: { type: boolean, description: "The tag points at a newer digest than lock.yaml pins; apply --update-lock takes it" }
        error: { type: string }
    Alert:
      type: object
      properties:
        source: { type: string, description: "The tool, e.g. dozzle", maxLength: 120 }
        rule: { type: string, description: The tool's name for what matched, maxLength: 120 }
        container: { type: string, description: Where it happened, maxLength: 120 }
        host: { type: string, description: The Docker host the tool runs on, maxLength: 120 }
        detail: { type: string, description: "What matched, e.g. the log line", maxLength: 2000 }
    Plan:
      type: object
      description: The `nepfleet plan --json` format, plus its id.
      required: [id]
      properties:
        id: { type: string }
        destructive:
          type: array
          items: { type: string }
        migrationError:
          type: string
          description: Why this upgrade is refused.
        egress:
          type: string
          enum: [log, enforce]
          description: The stack's egress mode, when it isn't off.
      additionalProperties: true
